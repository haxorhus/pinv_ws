navsat_transform_node:
    ros__parameters:
        magnetic_declination_radians: 0.0
        publish_filtered_gps: True
        wait_for_datum: False
        zero_altitude: False
        yaw_offset: 1.0
        use_odometry_yaw: True
        delay: 0.0
        frequency: 10.0
        broadcast_utm_transform: True
    

ekf_filter_node:
  ros__parameters:
    frequency: 10.0
    sensor_timeout: 2.0
    two_d_mode: true
    print_diagnostics: true
    debug: false
    publish_tf: true
    publish_acceleration: false    

    map_frame: map
    odom_frame: odom
    base_link_frame: wamv/wamv/base_link
    world_frame: odom

    imu0: /navsat/imu
    imu0_config: [false, false, false,
                  true, true, true,
                  false, false, false,
                  false, false, false,
                  true, true, true]
    imu0_differential: false
    imu0_queue_size: 10

    odom0: /odometry/gps
    odom0_config: [true, true, false,
                   false, false, true,
                   false, false, false,
                   false, false, false,
                   true, true, true]
    odom0_differential: false
    odom0_queue_size: 10
