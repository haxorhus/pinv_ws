# Nav2 para el catamarán PINV (Jazzy).
#
# Restricciones del bote que fijan esta configuración:
#   - Dos motores diferenciales SIN reversa, lazo abierto (el ESP32 traduce
#     /cmd_vel). Nada puede pedir velocidad lineal negativa ni giro en el lugar.
#   - Área libre grande, sin detección de obstáculos: los costmaps solo tienen
#     el mapa vacío (static_layer), sin capas de obstáculos ni inflado.
#   - Objetivos en metros con origen en la posición inicial (map = odom).
#
# Los valores de velocidad y tolerancias son de arranque; se ajustan en el lago
# (Fase 7) cuando se conozca V_MAX.

bt_navigator:
  ros__parameters:
    global_frame: map
    robot_base_frame: base_link
    odom_topic: /odometry/filtered
    bt_loop_duration: 10
    default_server_timeout: 20
    wait_for_service_timeout: 1000
    action_server_result_timeout: 900.0
    navigators: ["navigate_to_pose", "navigate_through_poses"]
    navigate_to_pose:
      plugin: "nav2_bt_navigator::NavigateToPoseNavigator"
    navigate_through_poses:
      plugin: "nav2_bt_navigator::NavigateThroughPosesNavigator"
    # default_nav_to_pose_bt_xml y default_nav_through_poses_bt_xml se pasan
    # desde navigation.launch.py (ruta absoluta a behavior_trees/ del paquete).
    error_code_names:
      - compute_path_error_code
      - follow_path_error_code

controller_server:
  ros__parameters:
    controller_frequency: 10.0          # contrato con el ESP32: /cmd_vel >= 10 Hz
    odom_topic: /odometry/filtered
    enable_stamped_cmd_vel: false       # el ESP32 suscribe geometry_msgs/Twist
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.5
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.3
    # Tras limpiar el costmap (recuperación) el controller espera una
    # actualización; con 0.3 s (default) la misión abortaba en vez de reintentar.
    costmap_update_timeout: 1.0
    progress_checker_plugins: ["progress_checker"]
    goal_checker_plugins: ["goal_checker"]
    controller_plugins: ["FollowPath"]

    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.5
      movement_time_allowance: 15.0

    goal_checker:
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 1.0
      # Sin reversa el bote no puede corregir el rumbo parado sobre el objetivo:
      # se ignora la orientación final (2*pi).
      yaw_goal_tolerance: 6.28
      stateful: true

    FollowPath:
      plugin: "nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController"
      desired_linear_vel: 1.0
      lookahead_dist: 3.0
      min_lookahead_dist: 2.0
      max_lookahead_dist: 8.0
      lookahead_time: 2.0
      use_velocity_scaled_lookahead_dist: true
      transform_tolerance: 0.5
      min_approach_linear_velocity: 0.3
      approach_velocity_scaling_dist: 3.0
      # Sin sensores de obstáculos no hay contra qué chequear colisiones.
      use_collision_detection: false
      max_allowed_time_to_collision_up_to_carrot: 1.0
      # Frena en curvas cerradas: es lo más parecido a un radio de giro mínimo.
      use_regulated_linear_velocity_scaling: true
      regulated_linear_scaling_min_radius: 3.0
      regulated_linear_scaling_min_speed: 0.3
      use_cost_regulated_linear_velocity_scaling: false
      use_fixed_curvature_lookahead: false
      curvature_lookahead_dist: 1.0
      # Sin reversa: ni giro en el lugar ni marcha atrás.
      use_rotate_to_heading: false
      allow_reversing: false
      rotate_to_heading_min_angle: 0.785
      rotate_to_heading_angular_vel: 1.0
      max_angular_accel: 3.2
      max_robot_pose_search_dist: 10.0
      interpolate_curvature_after_goal: false

local_costmap:
  local_costmap:
    ros__parameters:
      update_frequency: 5.0
      publish_frequency: 1.0
      global_frame: odom
      robot_base_frame: base_link
      transform_tolerance: 0.5
      rolling_window: true
      width: 40
      height: 40
      resolution: 1.0
      footprint: "[ [1.0, 0.5], [1.0, -0.5], [-1.0, -0.5], [-1.0, 0.5] ]"
      plugins: ["static_layer"]
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: true
      always_send_full_costmap: false

global_costmap:
  global_costmap:
    ros__parameters:
      update_frequency: 1.0
      publish_frequency: 0.5
      global_frame: map
      robot_base_frame: base_link
      transform_tolerance: 0.5
      robot_radius: 1.12               # media diagonal de 2 x 1 m
      resolution: 1.0
      track_unknown_space: false
      plugins: ["static_layer"]
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: true
      always_send_full_costmap: false

map_server:
  ros__parameters:
    # yaml_filename se pasa desde navigation.launch.py.
    topic_name: map
    frame_id: map

planner_server:
  ros__parameters:
    expected_planner_frequency: 1.0
    costmap_update_timeout: 1.0
    planner_plugins: ["GridBased"]
    GridBased:
      plugin: "nav2_navfn_planner::NavfnPlanner"
      tolerance: 1.0
      use_astar: false
      allow_unknown: true

behavior_server:
  ros__parameters:
    local_costmap_topic: local_costmap/costmap_raw
    global_costmap_topic: global_costmap/costmap_raw
    local_footprint_topic: local_costmap/published_footprint
    global_footprint_topic: global_costmap/published_footprint
    cycle_frequency: 10.0
    # Sin Spin ni BackUp: el bote no gira en el lugar ni va en reversa.
    behavior_plugins: ["wait"]
    wait:
      plugin: "nav2_behaviors::Wait"
    local_frame: odom
    global_frame: map
    robot_base_frame: base_link
    transform_tolerance: 0.5
    enable_stamped_cmd_vel: false

waypoint_follower:
  ros__parameters:
    loop_rate: 20
    stop_on_failure: false
    action_server_result_timeout: 900.0
    waypoint_task_executor_plugin: "wait_at_waypoint"
    wait_at_waypoint:
      plugin: "nav2_waypoint_follower::WaitAtWaypoint"
      enabled: true
      waypoint_pause_duration: 0
